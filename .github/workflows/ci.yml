name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      API_KEY_PEPPER: ci-pepper
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bootstrap databases and roles
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/bootstrap_postgres.sql
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests (Ollama-dependent tests are skipped)
        run: python -m pytest -o addopts="" -q -p no:cacheprovider -rs

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: qc-rca-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: qc-rca-web:ci
          build-args: VITE_API_BASE_URL=http://localhost:8000
      - name: Smoke test compose stack
        env:
          API_KEY_PEPPER: ci-pepper-secret
          ENV: production
        run: |
          docker compose up -d --build db api
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 3; done
          curl -sf http://localhost:8000/health | grep '"database":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/analytics/meta)" = "401"
          docker compose logs api | tail -20
          docker compose down -v
