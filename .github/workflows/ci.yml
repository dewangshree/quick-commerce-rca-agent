name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
      API_KEY_PEPPER: ci-pepper
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bootstrap databases and roles
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/bootstrap_postgres.sql
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests (Ollama-dependent tests are skipped)
        run: python -m pytest -o addopts="" -q -p no:cacheprovider -rs

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: qc-rca-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: qc-rca-web:ci
          build-args: VITE_API_BASE_URL=http://localhost:8000
      - name: Smoke test compose stack
        env:
          API_KEY_PEPPER: ci-pepper-secret
          ENV: production
        run: |
          docker compose up -d --build db api
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 3; done
          curl -sf http://localhost:8000/health | grep '"database":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/analytics/meta)" = "401"
          docker compose logs api | tail -20
          docker compose down -v

  render-image:
    name: Build and smoke-test the public (Render) image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build single-container image
        run: docker build -f deploy/Dockerfile.render -t qc-ops-public:ci .
      - name: Run with Render-like settings (512 MB, PORT=10000)
        run: |
          docker run -d --name qc --memory=512m -p 10000:10000 \
            -e PORT=10000 -e ENV=production -e AUTH_ENABLED=true -e PUBLIC_DEMO=true \
            -e API_KEY_PEPPER=ci-secret-value qc-ops-public:ci
          for i in $(seq 1 40); do curl -sf http://localhost:10000/health && break; sleep 3; done
      - name: Smoke checks
        run: |
          set -e
          curl -sf http://localhost:10000/health | grep '"database":true'
          curl -sf http://localhost:10000/ | grep -q '<div id="root">'
          curl -sf http://localhost:10000/api/v1/analytics/meta | grep -q '2026-04-22'
          curl -sf -X POST -H 'Content-Type: application/json' -H 'X-Visitor-Id: ci-visitor-1' \
            -d '{"question":"Why did STORE_101 underperform?"}' http://localhost:10000/api/v1/investigations | grep -q '"status":"completed"'
          for q in "Tell me about the thing" "What should we do when riders do not show up?" "hello" "How did Bangalore do?"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'X-Visitor-Id: ci-visitor-1' \
              -d "{\"question\":\"$q\"}" http://localhost:10000/api/v1/investigations)
            echo "$q -> $code"; test "$code" = "200"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/api/v1/admin/audit)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/docs)" = "404"
          curl -sf http://localhost:10000/health | grep -q '"available":true'
          curl -sf -X POST -H 'Content-Type: application/json' -H 'X-Visitor-Id: ci-visitor-1' \
            -d '{"query":"what to do about rider no-shows","k":3}' http://localhost:10000/api/v1/knowledge/search \
            | tee /tmp/search.json | grep -q '"mode":"hybrid"'
          grep -q 'sop_rider_supply' /tmp/search.json
          docker stats --no-stream qc
          test "$(docker inspect -f '{{.State.OOMKilled}}' qc)" = "false"
      - name: Restart survives (data baked into image)
        run: |
          docker restart qc
          for i in $(seq 1 40); do curl -sf http://localhost:10000/health && break; sleep 3; done
          curl -sf http://localhost:10000/api/v1/analytics/overview | grep -q '"total_orders":187171'
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"query":"sustained pileup","k":2}' \
            http://localhost:10000/api/v1/knowledge/search | grep -q '"mode":"hybrid"'
      - if: always()
        run: docker logs qc 2>&1 | tail -40
